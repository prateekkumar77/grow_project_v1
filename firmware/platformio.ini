; default_envs restricts a bare `pio run`/`pio run -t upload` (no -e flag)
; to just esp32dev - the production firmware. Without this, PlatformIO
; builds/uploads every environment below in turn, so a plain `pio run -t
; upload` would flash esp32dev and then immediately overwrite it with
; ir_capture (last one wins), leaving the board running the one-time
; capture sketch instead of your actual firmware. Capture utility is
; still fully usable, just needs its environment named explicitly:
;   pio run -e ir_capture -t upload
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    bblanchon/ArduinoJson@^6.21.5
    crankyoldgit/IRremoteESP8266@^2.8.6
; Everything in src/ except ir_capture.cpp and ir_test.cpp, which belong
; to the environments below, not the production firmware (each has its
; own setup()/loop() and would collide with main.cpp's if both built).
build_src_filter = +<*> -<ir_capture.cpp> -<ir_test.cpp>

; One-time utility, not the production firmware - reads raw IR codes off
; your real AC remote for pasting into include/ir_codes.h. See "Capturing
; your AC's IR codes" in README.md. Build/flash it explicitly:
;   pio run -e ir_capture -t upload && pio device monitor
[env:ir_capture]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
; The mirror image of esp32dev's filter above - only ir_capture.cpp, none
; of the production firmware's files (which would otherwise also pull in
; ArduinoJson/DHT, dependencies this environment never installs).
build_src_filter = -<*> +<ir_capture.cpp>

; One-time utility, not the production firmware - replays the codes in
; ir_codes.h every 5s so you can confirm the IR transmitter is wired up
; and the AC actually responds, before trusting the real firmware to
; drive it. See firmware/src/ir_test.cpp. Build/flash it explicitly:
;   pio run -e ir_test -t upload && pio device monitor
; Then reflash production firmware when done:
;   pio run -e esp32dev -t upload
[env:ir_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
; Only ir_test.cpp, same reasoning as ir_capture's filter above.
build_src_filter = -<*> +<ir_test.cpp>
